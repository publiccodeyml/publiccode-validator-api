version: 2

before:
  hooks:
    - go mod tidy
    - go generate ./...
builds:
  - env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -buildid=
      - -X main.Version={{.Version}}
      - -X main.Commit={{.ShortCommit}}
    goos:
      - linux
archives:
  - formats: [tar.gz]
sboms:
  - artifacts: archive

checksum:
  name_template: "checksums.txt"
snapshot:
  version_template: "{{ incpatch .Version }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
dockers_v2:
  - dockerfile: Dockerfile.goreleaser
    images:
      - "ghcr.io/publiccodeyml/publiccode-validator-api"
    tags:
      - "{{ .Tag }}"
      - "latest"
    platforms:
      - linux/amd64
    # The release job uses the default docker buildx driver, which cannot
    # push attestations.
    sbom: false
